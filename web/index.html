<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chief of Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141413);--ink:light-dark(#141413,#efeee9);--muted:light-dark(#62615c,#a7a59d);--line:light-dark(#e3e2dc,#2f2e2b);--panel:light-dark(#f4f3ee,#1e1d1b);--me:light-dark(#141413,#efeee9);--me-ink:light-dark(#ffffff,#141413);--accent:light-dark(#1f5fbf,#7fb0ff);--warn:light-dark(#b3261e,#ff9b92)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{font-size:13px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px "Hanken Grotesk",system-ui,sans-serif;cursor:pointer;min-height:40px;white-space:nowrap;flex:none}
.ghost:hover{border-color:var(--ink)}
#log{overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;white-space:normal;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--panel);border-bottom-left-radius:6px}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:4px 0 8px;padding-left:22px}
.msg.bot code{font:14px ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:5px}
.msg.err{align-self:flex-start;color:var(--warn);background:none;padding:4px 2px;font-size:14px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.empty{margin:auto 0;padding:24px 0}
.empty h2{font-size:clamp(28px,6vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:500 15px "Hanken Grotesk",system-ui,sans-serif;color:var(--ink);cursor:pointer;text-align:left;min-height:44px}
.chip:hover{border-color:var(--ink)}
form.compose{display:flex;gap:10px;align-items:flex-end;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;max-height:180px;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:16px/1.4 "Hanken Grotesk",system-ui,sans-serif}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
.send{min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:600 16px "Hanken Grotesk",system-ui,sans-serif;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.gate{height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(380px,100%);display:grid;gap:12px}
.gate h1{font-size:32px;letter-spacing:-.02em}
.gate input{min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px "Hanken Grotesk",system-ui,sans-serif}
.gate .err{color:var(--warn);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm">
    <h1>Chief of Staff</h1>
    <p class="note">Private chat. Enter your password.</p>
    <label for="pw" class="note" hidden>Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="send" type="submit">Open chat</button>
    <p class="err" id="gateErr" hidden></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <header>
    <div><h1>Chief of Staff</h1><div class="sub">Reminds, warns and drafts. Never sends or books.</div></div>
    <button class="ghost" id="newChat" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form class="compose" id="compose">
    <label for="input" hidden>Message</label>
    <textarea id="input" rows="1" placeholder="Message your chief of staff…"></textarea>
    <button class="send" id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
{
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
    sget(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    sset(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
    sdel(k) { try { sessionStorage.removeItem(k); } catch {} }
  };

  let password = store.sget('cos-pw') || '';
  let history = [];
  try { history = JSON.parse(store.get('cos-history') || '[]'); if (!Array.isArray(history)) history = []; } catch { history = []; }
  let busy = false;

  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function md(text) {
    // Small, safe markdown: escape first, then bold, inline code, lists, paragraphs.
    const lines = esc(text).split('\n');
    let out = '', list = null;
    const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const close = () => { if (list) { out += '</' + list + '>'; list = null; } };
    let para = [];
    const flush = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    for (const raw of lines) {
      const l = raw.trimEnd();
      let m;
      if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { flush(); if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flush(); if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; }
      else if (!l.trim()) { flush(); close(); }
      else { close(); para.push(l.replace(/^#{1,6}\s+/, '')); }
    }
    flush(); close();
    return out;
  }
  const textOf = content => typeof content === 'string' ? content : (content || []).filter(b => b && b.type === 'text').map(b => b.text).join('');

  function bubble(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    if (cls === 'bot') el.innerHTML = md(text); else el.textContent = text;
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
    return el;
  }

  const STARTERS = ['Plan my day', 'What should I prepare for this week?', 'Help me draft a reply', 'What am I forgetting?'];
  function render() {
    $('log').innerHTML = '';
    if (!history.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<h2>What do you need?</h2><p>I know your rule book and your priorities. I can plan, remind and draft, but I never send or book anything.</p><div class="chips"></div>';
      const chips = e.querySelector('.chips');
      STARTERS.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s; b.onclick = () => send(s); chips.appendChild(b); });
      $('log').appendChild(e);
      return;
    }
    history.forEach(m => bubble(m.role === 'user' ? 'me' : 'bot', textOf(m.content)));
  }

  function save() { store.set('cos-history', JSON.stringify(history)); }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; $('sendBtn').disabled = true;
    if (!history.length) $('log').innerHTML = '';
    history.push({ role: 'user', content: text });
    bubble('me', text);
    $('input').value = ''; grow();
    const out = bubble('bot', ''); out.classList.add('typing');
    let acc = '', done = false, failed = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-chat-password': password },
        body: JSON.stringify({ messages: history })
      });
      if (res.status === 401) { lock('Wrong password. Please enter it again.'); failed = 'locked'; }
      else if (!res.ok || !res.body) { let m = 'Something went wrong.'; try { m = (await res.json()).error || m; } catch {} failed = m; }
      else {
        const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
        for (;;) {
          const { value, done: end } = await reader.read();
          if (end) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, i); buf = buf.slice(i + 1);
            if (!line.trim()) continue;
            let ev; try { ev = JSON.parse(line); } catch { continue; }
            if (ev.t === 'text') { acc += ev.d; out.innerHTML = md(acc); $('log').scrollTop = $('log').scrollHeight; }
            else if (ev.t === 'done') { history.push({ role: 'assistant', content: ev.content }); done = true; }
            else if (ev.t === 'error') { failed = ev.m || 'Something went wrong.'; }
          }
        }
        if (!done && !failed) failed = 'The reply was cut off. Please try again.';
      }
    } catch { failed = 'No connection. Check your internet and try again.'; }
    out.classList.remove('typing');
    if (!done) {
      // Take the unanswered message back out so the conversation stays valid, and put it back in the box.
      history.pop();
      if (!acc) out.remove();
      if (failed !== 'locked') { bubble('err', failed); $('input').value = text; grow(); }
    }
    save();
    busy = false; $('sendBtn').disabled = false;
    $('input').focus();
  }

  function lock(msg) {
    password = ''; store.sdel('cos-pw');
    $('app').hidden = true; $('gate').hidden = false;
    $('gateErr').textContent = msg || ''; $('gateErr').hidden = !msg;
    $('pw').value = ''; $('pw').focus();
  }
  function unlock() { $('gate').hidden = true; $('app').hidden = false; render(); $('input').focus(); }

  $('gateForm').addEventListener('submit', e => {
    e.preventDefault();
    password = $('pw').value; store.sset('cos-pw', password); unlock();
  });
  $('compose').addEventListener('submit', e => { e.preventDefault(); send($('input').value); });
  function grow() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
  $('input').addEventListener('input', grow);
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); } });
  $('newChat').addEventListener('click', () => { if (busy) return; history = []; store.del('cos-history'); render(); $('input').focus(); });

  if (password) unlock(); else lock();
}
</script>
</body>
</html>
